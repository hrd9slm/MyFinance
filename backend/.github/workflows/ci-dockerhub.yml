name: Backend CI/CD

on:
  push:
    branches:
      - "CI/CD"
      - "releases/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Run tests
        run: |
          cd backend
          npm test

  build_and_push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest

  deploy:
      needs: build_and_push
      runs-on: ubuntu-latest
      steps:
        - name: Deploy to VPS
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC_HOST }}
            username: ${{ secrets.EC_USERNAME }}
            key: ${{ secrets.EC_PRIVATE_KEY }}
            port: 22
            script: |
              docker pull ${{ secrets.DOCKER_USERNAME }}/backend:latest
              docker stop backend || true
              docker rm backend || true
              docker run -d --name backend -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/backend:latest
